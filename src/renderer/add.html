<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">
    <title>Add target</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <form id="add">
        <label for="name">Name:</label>
        <input required type="text" name="name">

        <label for="url">Target URL:</label>
        <input required type="text" name="url" placeholder="user@host:/remote/path" id="url-input">
        <div class="help-text" id="url-help">Tip: Paste an SSH command (e.g. <code>ssh user@host -p 3333</code>) to auto-fill fields</div>

        <label for="mount">Mount Path:</label>
        <input required type="text" name="mount">
        <div class="help-text">Local directory where remote files will appear</div>

        <label for="port">Port:</label>
        <input type="text" name="port" placeholder="22 (default)">

        <label for="identityFile">Identity File:</label>
        <input type="text" name="identityFile" placeholder="~/.ssh/id_rsa (default)">

        <label for="sshOptions">SSH Options:</label>
        <input type="text" name="sshOptions" placeholder="-o Option=Value">

        <label for="authType">Auth Type:</label>
        <select name="authType">
            <option value="key">SSH Key (default)</option>
            <option value="password">Password</option>
        </select>

        <div id="password-row" style="display: none;">
            <label for="password">Password:</label>
            <input type="password" name="password">
        </div>

        <div id="autoconnect-row">
            <label for="autoconnect">Auto-connect:</label>
            <input type="checkbox" name="autoconnect">
        </div>

        <div id="status-message"></div>
        <div id="button-row">
            <button type="button" id="test-btn">Test Connection</button>
            <input type="submit" value="Add">
        </div>
    </form>
</body>

<script src="utils.js"></script>
<script src="add.js"></script>
</html>
